name: Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
      - 'package-lock.json'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      # Cache preparation can run in parallel. Release uploads share latest.json.
      max-parallel: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 3 }}
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected=process.env.RELEASE_TAG.replace(/^v/, ''); const actual=require('./package.json').version; if (expected !== actual) { console.error('La etiqueta y package.json no coinciden:', expected, actual); process.exit(1); }"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.platform }}
          # Tags can restore master's cache, but not caches from other tags.
          # Save only on master to avoid a duplicate cache for every release.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Prepare release dependencies cache
        if: github.ref == 'refs/heads/master'
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BucRater ${{ github.ref_name }}
          releaseBody: Actualización de BucRater ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
